name: Multi-Platform Automated Release (Windows, Android, Web)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version override (e.g. 4.15.0). Leave empty for auto-bump based on changes.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  # --------------------------------------------------------------------------
  # 1. VERSIONING JOB: Analyzes commit history and automatically bumps version
  # --------------------------------------------------------------------------
  prepare-version:
    name: Determine & Bump Version (Semantic Versioning)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag_name: ${{ steps.bump.outputs.tag_name }}
      bump_type: ${{ steps.bump.outputs.bump_type }}
      version_code: ${{ steps.bump.outputs.version_code }}
    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calculate & Bump Version Based on Changes
        id: bump
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force || true

          # Run automated version bumper
          node scripts/bump-version.js "$MANUAL_VERSION"

          NEW_VER="${{ steps.bump.outputs.version }}"
          TAG="v$NEW_VER"

          echo "Target Version determined: $NEW_VER ($TAG)"

          # Commit updated version files back to repository with [skip ci] to prevent loop
          git add package.json client/package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml android/app/build.gradle 2>/dev/null || true
          
          if ! git diff --cached --quiet; then
            echo "Committing bumped version files..."
            git commit -m "chore(release): bump version to $TAG [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || git push origin HEAD || true
          else
            echo "No version file changes needed commit."
          fi

          # Create and push git tag
          git tag "$TAG" || true
          git push origin "$TAG" --force || true

      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  # --------------------------------------------------------------------------
  # 2. ANDROID JOB: Compiles and signs APK installer
  # --------------------------------------------------------------------------
  build-android:
    name: Build Android APK Installer
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Distribution
        run: |
          if grep -q '"build"' package.json; then
            npm run build || npx vite build || true
          fi
          # Ensure dist directory exists
          mkdir -p dist

      - name: Verify or Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Capacitor Android platform..."
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android || true

      - name: Verify Gradle Wrapper & Compile Signed APK
        run: |
          # Verify or repair gradle-wrapper.jar
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ] || ! unzip -t android/gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            echo "Downloading healthy gradle-wrapper.jar..."
            mkdir -p android/gradle/wrapper
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar" -o android/gradle/wrapper/gradle-wrapper.jar
          fi

          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease || ./gradlew assembleDebug
          cd ..

          RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found compiled APK: $RAW_APK"

          if [ -z "$RAW_APK" ]; then
            echo "Error: Android build did not produce an APK!" && exit 1
          fi

          # Create release signing keystore
          keytool -genkeypair -v -keystore release.keystore -alias safewatch -keyalg RSA -keysize 2048 -validity 10000 -storepass safewatch123 -keypass safewatch123 -dname "CN=SafeWatch, OU=HSE, O=SafeWatch, L=Tehran, ST=Tehran, C=IR" -noprompt || true

          # Locate apksigner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Signing APK using build-tools: $BUILD_TOOLS_DIR"

          VERSION="${{ needs.prepare-version.outputs.version }}"
          APK_NAME="SafeWatch-v${VERSION}-Android.apk"

          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:safewatch123 --key-pass pass:safewatch123 --out "$APK_NAME" "$RAW_APK"
          $BUILD_TOOLS_DIR/apksigner verify "$APK_NAME" && echo "APK signed and verified successfully!"

      - name: Upload Android Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-installer
          path: SafeWatch-v${{ needs.prepare-version.outputs.version }}-Android.apk

  # --------------------------------------------------------------------------
  # 3. WINDOWS JOB: Compiles Windows Desktop Installer (.msi / .exe)
  # --------------------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop Installer (.msi)
    needs: prepare-version
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Distribution
        shell: bash
        run: |
          if [ -f "scripts/generate-icons.js" ]; then
            node scripts/generate-icons.js || true
          fi
          npm run build || npx vite build || true
          mkdir -p dist

      - name: Build Tauri Windows Installer
        shell: bash
        run: |
          npx @tauri-apps/cli build || npm run tauri build

      - name: Locate and Rename Windows Installer
        shell: pwsh
        run: |
          $version = "${{ needs.prepare-version.outputs.version }}"
          $destName = "SafeWatch-v$version-Windows-Setup.msi"
          
          # Search for generated MSI or EXE bundle
          $installer = Get-ChildItem -Path "src-tauri\target\release\bundle" -Recurse -Include *.msi,*.exe | Select-Object -First 1
          if ($installer) {
            Write-Host "Found Windows Installer at: $($installer.FullName)"
            Copy-Item $installer.FullName -Destination ".\$destName"
            Write-Host "Prepared $destName for release."
          } else {
            Write-Error "No Windows installer (.msi or .exe) found in Tauri release directory."
            exit 1
          }

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: SafeWatch-v${{ needs.prepare-version.outputs.version }}-Windows-Setup.msi

  # --------------------------------------------------------------------------
  # 4. WEB JOB: Packages Standalone Web / PWA archive
  # --------------------------------------------------------------------------
  build-web:
    name: Package Web Distribution (PWA)
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci || npm install
          npm run build || npx vite build || true
          mkdir -p dist

      - name: Create Web Distribution Archive
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          zip -r "SafeWatch-v${VERSION}-Web-PWA.zip" dist package.json 2>/dev/null || zip -r "SafeWatch-v${VERSION}-Web-PWA.zip" . -x "*.git*" "node_modules/*" ".next/*" "target/*"

      - name: Upload Web Archive
        uses: actions/upload-artifact@v4
        with:
          name: web-installer
          path: SafeWatch-v${{ needs.prepare-version.outputs.version }}-Web-PWA.zip

  # --------------------------------------------------------------------------
  # 5. PUBLISH RELEASE JOB: Gathers all installers and publishes GitHub Release
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release with Installers
    needs: [prepare-version, build-android, build-windows, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Version Release Notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download Android Installer
        uses: actions/download-artifact@v4
        with:
          name: android-installer
          path: release-assets

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets

      - name: Download Web Archive
        uses: actions/download-artifact@v4
        with:
          name: web-installer
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          TAG="${{ needs.prepare-version.outputs.tag_name }}"

          echo "Publishing GitHub Release $TAG with installers:"
          ls -la release-assets/

          # Check if release already exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating notes and uploading installer assets..."
            gh release edit "$TAG" --title "SafeWatch HSE v${VERSION}" --notes-file release-notes.md || true
            gh release upload "$TAG" release-assets/* --clobber
          else
            echo "Creating new GitHub Release $TAG..."
            gh release create "$TAG" release-assets/* \
              --title "SafeWatch HSE v${VERSION}" \
              --notes-file release-notes.md || \
            gh release upload "$TAG" release-assets/* --clobber
          fi
