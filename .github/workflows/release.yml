name: Multi-Platform Automated Release (Windows, Android, Web)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version override (e.g. 4.15.0). Leave empty for auto-bump based on changes.'
        required: false
        default: ''

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  # --------------------------------------------------------------------------
  # 1. VERSIONING JOB: Analyzes commit history, bumps version, and initiates Release
  # --------------------------------------------------------------------------
  prepare-version:
    name: Determine & Bump Version (Semantic Versioning)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag_name: ${{ steps.bump.outputs.tag_name }}
      bump_type: ${{ steps.bump.outputs.bump_type }}
      version_code: ${{ steps.bump.outputs.version_code }}
    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Old Actions Artifacts (Free Quota)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Purging old GitHub Actions artifacts to free storage quota..."
          gh api --paginate -X GET "repos/${{ github.repository }}/actions/artifacts" --jq '.artifacts[]?.id' 2>/dev/null | head -n 100 | while read -r art_id; do
            if [ -n "$art_id" ]; then
              echo "Deleting obsolete artifact ID: $art_id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$art_id" 2>/dev/null || true
            fi
          done || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calculate & Bump Version Based on Changes
        id: bump
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force || true

          # Run automated version bumper
          node scripts/bump-version.js "$MANUAL_VERSION"

          # Extract target version directly from package.json to avoid uninitialized step output read
          NEW_VER=$(node -p "require('./package.json').version")
          TAG="v$NEW_VER"

          echo "Target Version determined: $NEW_VER ($TAG)"

          # Explicitly emit step outputs for downstream jobs
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

          # Commit updated version files back to repository with [skip ci] to prevent loop
          git add package.json package-lock.json client/package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml android/app/build.gradle 2>/dev/null || true
          
          if ! git diff --cached --quiet; then
            echo "Committing bumped version files..."
            git commit -m "chore(release): bump version to $TAG [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || git push origin HEAD || true
          else
            echo "No version file changes needed commit."
          fi

          # Create and push git tag with retry mechanism
          echo "Creating and verifying tag $TAG..."
          git tag -f "$TAG"

          echo "Pushing tag $TAG to origin with retries..."
          PUSHED=false
          for i in {1..5}; do
            if git push origin "refs/tags/$TAG" --force; then
              echo "Successfully pushed tag $TAG on attempt $i"
              PUSHED=true
              break
            else
              echo "Push failed on attempt $i, retrying in 3 seconds..."
              sleep 3
            fi
          done

          if [ "$PUSHED" != "true" ]; then
            echo "Error: Failed to push tag $TAG after multiple attempts."
            exit 1
          fi

          # Verify remote tag replication
          echo "Verifying tag $TAG exists on remote repository..."
          VERIFIED=false
          for i in {1..10}; do
            REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/$TAG")
            if [ -n "$REMOTE_TAG" ]; then
              echo "Verified: Tag $TAG is available on remote repository."
              VERIFIED=true
              break
            else
              echo "Waiting for remote tag replication (attempt $i/10)..."
              sleep 2
            fi
          done

          if [ "$VERIFIED" != "true" ]; then
            echo "Warning: Remote tag check did not return immediately, but tag push succeeded."
          fi

          # Propagation cooldown to ensure all GitHub replica nodes have the tag
          sleep 3

          # Initialize GitHub Release directly (Zero storage quota usage!)
          echo "Initializing GitHub Release $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "SafeWatch HSE v${NEW_VER}" --notes-file release-notes.md || true
          else
            gh release create "$TAG" --title "SafeWatch HSE v${NEW_VER}" --notes-file release-notes.md || true
          fi

  # --------------------------------------------------------------------------
  # 2. ANDROID JOB: Compiles, signs APK, and uploads directly to GitHub Release
  # --------------------------------------------------------------------------
  build-android:
    name: Build Android APK Installer
    needs: prepare-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Guard & Checkout Release Tag
        run: |
          TAG="${{ needs.prepare-version.outputs.tag_name }}"
          echo "Verifying availability of release tag $TAG..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Guard: loop until tag is reachable or maximum retry reached
          FOUND=false
          for i in {1..8}; do
            if git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force 2>/dev/null; then
              echo "Release tag $TAG fetched successfully on attempt $i."
              git checkout "refs/tags/$TAG" 2>/dev/null || git checkout "$TAG"
              FOUND=true
              break
            else
              echo "Tag $TAG not found yet on origin (attempt $i/8), waiting 2s..."
              sleep 2
            fi
          done

          if [ "$FOUND" != "true" ]; then
            echo "Notice: Tag checkout fell back to current commit workspace (version files already updated)."
          fi
          echo "Head commit after checkout guard: $(git rev-parse --short HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Install NPM Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Distribution
        run: |
          if [ -f "scripts/generate-icons.js" ]; then
            node scripts/generate-icons.js
          fi
          npm run build:vite

      - name: Verify or Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Capacitor Android platform..."
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: |
          npx cap sync android || true

      - name: Clean Corrupted Gradle Cache & Compile Signed APK
        run: |
          # Purge any corrupt cached jars (such as bcprov-jdk18on or broken downloads)
          rm -rf ~/.gradle/caches/modules-2/files-2.1/org.bouncycastle 2>/dev/null || true
          rm -rf ~/.gradle/caches/transforms-* 2>/dev/null || true
          rm -f ~/.gradle/caches/modules-2/modules-2.lock 2>/dev/null || true

          # Verify or repair gradle-wrapper.jar
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ] || ! unzip -t android/gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            echo "Downloading healthy gradle-wrapper.jar..."
            mkdir -p android/gradle/wrapper
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar" -o android/gradle/wrapper/gradle-wrapper.jar
          fi

          chmod +x android/gradlew
          cd android
          
          # Attempt build with --no-daemon, and fallback with fresh cache if corrupted
          ./gradlew assembleRelease --no-daemon || {
            echo "First build attempt failed, cleaning transforms and retrying with refresh-dependencies..."
            rm -rf ~/.gradle/caches/modules-2/files-2.1/*bcprov* 2>/dev/null || true
            rm -rf ~/.gradle/caches/transforms-* 2>/dev/null || true
            ./gradlew assembleRelease --no-daemon --refresh-dependencies || ./gradlew assembleDebug --no-daemon --refresh-dependencies
          }
          cd ..

          RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found compiled APK: $RAW_APK"

          if [ -z "$RAW_APK" ]; then
            echo "Error: Android build did not produce an APK!" && exit 1
          fi

          # Create release signing keystore
          keytool -genkeypair -v -keystore release.keystore -alias safewatch -keyalg RSA -keysize 2048 -validity 10000 -storepass safewatch123 -keypass safewatch123 -dname "CN=SafeWatch, OU=HSE, O=SafeWatch, L=Tehran, ST=Tehran, C=IR" -noprompt || true

          # Locate apksigner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Signing APK using build-tools: $BUILD_TOOLS_DIR"

          VERSION="${{ needs.prepare-version.outputs.version }}"
          APK_NAME="SafeWatch-v${VERSION}-Android.apk"

          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:safewatch123 --key-pass pass:safewatch123 --out "$APK_NAME" "$RAW_APK"
          $BUILD_TOOLS_DIR/apksigner verify "$APK_NAME" && echo "APK signed and verified successfully!"

      - name: Upload Android Installer Directly to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare-version.outputs.tag_name }}"
          VERSION="${{ needs.prepare-version.outputs.version }}"
          APK_NAME="SafeWatch-v${VERSION}-Android.apk"
          echo "Uploading $APK_NAME directly to GitHub Release $TAG (Bypassing Action artifact quota)..."
          gh release upload "$TAG" "$APK_NAME" --clobber

  # --------------------------------------------------------------------------
  # 3. WINDOWS JOB: Compiles Windows MSI and uploads directly to GitHub Release
  # --------------------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop Installer (.msi)
    needs: prepare-version
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Guard & Checkout Release Tag
        shell: bash
        run: |
          TAG="${{ needs.prepare-version.outputs.tag_name }}"
          echo "Verifying availability of release tag $TAG..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Guard: loop until tag is reachable or maximum retry reached
          FOUND=false
          for i in {1..8}; do
            if git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force 2>/dev/null; then
              echo "Release tag $TAG fetched successfully on attempt $i."
              git checkout "refs/tags/$TAG" 2>/dev/null || git checkout "$TAG"
              FOUND=true
              break
            else
              echo "Tag $TAG not found yet on origin (attempt $i/8), waiting 2s..."
              sleep 2
            fi
          done

          if [ "$FOUND" != "true" ]; then
            echo "Notice: Tag checkout fell back to current commit workspace (version files already updated)."
          fi
          echo "Head commit after checkout guard: $(git rev-parse --short HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install NPM Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Distribution
        shell: bash
        run: |
          if [ -f "scripts/generate-icons.js" ]; then
            node scripts/generate-icons.js
          fi
          npm run build:vite

      - name: Build Tauri Windows Installer
        shell: bash
        run: |
          npm run tauri -- build

      - name: Locate, Rename, and Upload Windows Installer to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          TAG="${{ needs.prepare-version.outputs.tag_name }}"
          DEST_NAME="SafeWatch-v${VERSION}-Windows-Setup.msi"
          
          INSTALLER=$(find src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.exe" \) | head -n 1)
          if [ -n "$INSTALLER" ]; then
            echo "Found Windows installer: $INSTALLER"
            cp "$INSTALLER" "$DEST_NAME"
            echo "Uploading $DEST_NAME directly to GitHub Release $TAG (Bypassing Action artifact quota)..."
            gh release upload "$TAG" "$DEST_NAME" --clobber
          else
            echo "Error: No Windows installer (.msi or .exe) found in Tauri release directory!"
            exit 1
          fi

  # --------------------------------------------------------------------------
  # 4. WEB JOB: Packages Standalone Web archive directly to GitHub Release
  # --------------------------------------------------------------------------
  build-web:
    name: Package Web Distribution (PWA)
    needs: prepare-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Guard & Checkout Release Tag
        run: |
          TAG="${{ needs.prepare-version.outputs.tag_name }}"
          echo "Verifying availability of release tag $TAG..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Guard: loop until tag is reachable or maximum retry reached
          FOUND=false
          for i in {1..8}; do
            if git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force 2>/dev/null; then
              echo "Release tag $TAG fetched successfully on attempt $i."
              git checkout "refs/tags/$TAG" 2>/dev/null || git checkout "$TAG"
              FOUND=true
              break
            else
              echo "Tag $TAG not found yet on origin (attempt $i/8), waiting 2s..."
              sleep 2
            fi
          done

          if [ "$FOUND" != "true" ]; then
            echo "Notice: Tag checkout fell back to current commit workspace (version files already updated)."
          fi
          echo "Head commit after checkout guard: $(git rev-parse --short HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build
        run: |
          npm install --no-audit --no-fund
          if [ -f "scripts/generate-icons.js" ]; then
            node scripts/generate-icons.js
          fi
          npm run build:vite

      - name: Create and Upload Web Archive directly to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          TAG="${{ needs.prepare-version.outputs.tag_name }}"
          ZIP_NAME="SafeWatch-v${VERSION}-Web-PWA.zip"

          zip -r "$ZIP_NAME" dist package.json 2>/dev/null || zip -r "$ZIP_NAME" . -x "*.git*" "node_modules/*" ".next/*" "target/*"
          echo "Uploading $ZIP_NAME directly to GitHub Release $TAG (Bypassing Action artifact quota)..."
          gh release upload "$TAG" "$ZIP_NAME" --clobber

  # --------------------------------------------------------------------------
  # 5. FINALIZE RELEASE: Verifies assets on GitHub Release
  # --------------------------------------------------------------------------
  finalize-release:
    name: Verify Completed Release
    needs: [prepare-version, build-android, build-windows, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: View Published Release Details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare-version.outputs.tag_name }}"
          echo "=========================================================="
          echo "Successfully published all multi-platform installers for: $TAG"
          echo "=========================================================="
          gh release view "$TAG"
